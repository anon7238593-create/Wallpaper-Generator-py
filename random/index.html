<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Random Wallpaper</title>
  <link rel="icon" href="../favicon.png" type="image/png">
  <script>
    (function() {
      const TOTAL_WALLPAPERS = 911400;
      const params = new URLSearchParams(window.location.search);
      const isViewMode = params.has('view');
      const idx = Math.floor(Math.random() * TOTAL_WALLPAPERS) + 1;
      const filename = `wallpaper-${idx}.png`;
      const url = `../wallpapers/${filename}`;

      if (!isViewMode) {
        // Direct endpoint behavior: immediately redirect to random wallpaper image
        window.location.replace(url);
      } else {
        // Save details for viewer mode
        window.__randomWallpaper = { idx, filename, url };
      }
    })();
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=../wallpapers/wallpaper-1.png">
  </noscript>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0f1015;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.75rem 1.5rem;
      background: rgba(15, 16, 21, 0.9);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid #2b2c37;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .brand {
      color: #9ca3af;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
    }
    .brand:hover { color: #fff; }
    .title { font-weight: 600; font-size: 0.95rem; font-family: monospace; }
    .nav-btns { display: flex; gap: 0.5rem; }
    a.btn, button.btn {
      background: #181920;
      color: #f3f4f6;
      border: 1px solid #2b2c37;
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s;
    }
    a.btn:hover, button.btn:hover { background: #22232c; border-color: #3f4152; }
    .btn.primary { background: #6366f1; border-color: #6366f1; color: #fff; }
    .btn.primary:hover { background: #4f46e5; }
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }
    main img {
      max-width: 100%;
      max-height: calc(100vh - 5.5rem);
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      object-fit: contain;
    }
  </style>
</head>
<body>
  <header>
    <a href="../" class="brand">Back to Gallery</a>
    <div class="title" id="wp-title">Random Wallpaper</div>
    <div class="nav-btns">
      <button class="btn" onclick="location.reload()">Another Random</button>
      <a id="download-btn" class="btn primary" download>Download 4K</a>
    </div>
  </header>
  <main>
    <img id="wallpaper-img" alt="Random 4K Wallpaper">
  </main>
  <script>
    if (window.__randomWallpaper) {
      const { idx, filename, url } = window.__randomWallpaper;
      document.getElementById('wallpaper-img').src = url;
      document.getElementById('wallpaper-img').alt = filename;
      document.getElementById('wp-title').textContent = `Wallpaper #${idx}`;
      const dl = document.getElementById('download-btn');
      dl.href = url;
      dl.setAttribute('download', filename);
    }
  </script>
</body>
</html>
