<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Wallpaper Generator (4K)</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <style>
    :root {
      --bg: #0f1015;
      --card-bg: #181920;
      --card-hover: #21222c;
      --border: #2b2c37;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem;
    }
    header {
      max-width: 1440px;
      margin: 0 auto 1.5rem;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }
    .title-group h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .actions {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.6rem;
    }
    .btn {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--card-hover); border-color: #3f4152; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: var(--accent-hover); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .toolbar {
      max-width: 1440px;
      margin: 0 auto 1.25rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 0.75rem;
      font-size: 0.88rem;
      color: var(--text-muted);
    }
    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .grid {
      max-width: 1440px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform 0.15s, border-color 0.15s;
    }
    .card:hover { transform: translateY(-2px); border-color: #434557; }
    .img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #141419;
      overflow: hidden;
    }
    .img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.55rem 0.75rem;
      font-size: 0.8rem;
    }
    .card-id {
      color: var(--text-muted);
      font-family: monospace;
      font-weight: 600;
    }
    .card-links { display: flex; gap: 0.5rem; }
    .card-links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.75rem;
      font-weight: 500;
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
    }
    .card-links a:hover { background: rgba(99, 102, 241, 0.15); }
    .pagination {
      max-width: 1440px;
      margin: 2rem auto;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 0.5rem;
    }
    .page-info {
      color: var(--text-muted);
      font-size: 0.88rem;
      padding: 0 0.5rem;
    }
    footer {
      max-width: 1440px;
      margin: 3rem auto 1rem;
      text-align: center;
      color: var(--text-muted);
      font-size: 0.82rem;
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }
    footer a { color: var(--text-muted); }
    footer a:hover { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <div class="title-group">
      <h1>Wallpaper Generator</h1>
    </div>
    <div class="actions">
      <a href="random/" class="btn primary" title="Gives a direct random wallpaper">/random</a>
      <a href="random/?view=1" class="btn" title="View random wallpaper interactively">Random Viewer</a>
      <a href="count" class="btn" target="_blank" title="API returning only number of wallpapers">Count API</a>
      <a href="wallpapers.json" class="btn" target="_blank">API JSON</a>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar-group">
      <span>Updated: 2026-09-18 16:35 UTC</span>
    </div>
  </div>

  <main class="grid" id="wallpaper-grid"></main>

  <nav class="pagination" id="pagination-controls">
    <button class="btn" id="prev-btn">Previous</button>
    <span class="page-info" id="page-indicator">Page 1</span>
    <button class="btn" id="next-btn">Next</button>
  </nav>

  <footer>
    <p>Generated automatically by GitHub Actions. Wallpapers saved in the <code>artifacts</code> branch.</p>
    <p style="margin-top:0.4rem;">Based on procedural wave algorithm by <a href="https://github.com/roytanck/wallpaper-generator" target="_blank" rel="noopener">Roy Tanck</a>.</p>
  </footer>

  <script>
    const TOTAL_WALLPAPERS = 721400;
    const WP_DIR = "wallpapers";
    const pageSize = 60;
    let currentPage = 1;

    const grid = document.getElementById('wallpaper-grid');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');
    const pageIndicator = document.getElementById('page-indicator');
    const paginationControls = document.getElementById('pagination-controls');

    function totalPages() {
      return Math.ceil(TOTAL_WALLPAPERS / pageSize);
    }

    function renderWallpapers() {
      grid.innerHTML = '';
      const startIdx = ((currentPage - 1) * pageSize) + 1;
      const endIdx = Math.min(currentPage * pageSize, TOTAL_WALLPAPERS);

      const fragment = document.createDocumentFragment();
      for (let i = startIdx; i <= endIdx; i++) {
        const filename = `wallpaper-${i}.png`;
        const path = `${WP_DIR}/${filename}`;

        const card = document.createElement('div');
        card.className = 'card';
        card.id = `wp-${i}`;

        card.innerHTML = `
          <div class="img-wrap">
            <a href="${path}" target="_blank" rel="noopener">
              <img src="${path}" alt="Wallpaper #${i}" loading="lazy" width="3840" height="2160">
            </a>
          </div>
          <div class="card-footer">
            <span class="card-id">#${i}</span>
            <div class="card-links">
              <a href="${path}" target="_blank" rel="noopener">View 4K</a>
              <a href="${path}" download="${filename}">Download</a>
            </div>
          </div>
        `;
        fragment.appendChild(card);
      }
      grid.appendChild(fragment);

      paginationControls.style.display = 'flex';
      const pages = totalPages();
      pageIndicator.textContent = `Page ${currentPage} of ${pages}`;
      prevBtn.disabled = currentPage <= 1;
      nextBtn.disabled = currentPage >= pages;
    }

    prevBtn.addEventListener('click', () => {
      if (currentPage > 1) {
        currentPage--;
        renderWallpapers();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    nextBtn.addEventListener('click', () => {
      if (currentPage < totalPages()) {
        currentPage++;
        renderWallpapers();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    renderWallpapers();
  </script>
  <noscript>
    <div style="max-width:1440px; margin:2rem auto; padding:1rem; background:#181920; border:1px solid #2b2c37; border-radius:8px;">
      <p>JavaScript is disabled. Explore wallpapers directly:</p>
      <ul style="margin:1rem 0 0 1.5rem;">
        <li><a href="random/" style="color:#6366f1;">Get a Random Wallpaper (/random)</a></li>
        <li><a href="count" style="color:#6366f1;">View Wallpaper Count API (/count)</a></li>
        <li><a href="wallpapers.json" style="color:#6366f1;">View wallpapers.json manifest</a></li>
        <li><a href="wallpapers/wallpaper-1.png" style="color:#6366f1;">View Wallpaper #1</a></li>
      </ul>
    </div>
  </noscript>
</body>
</html>
