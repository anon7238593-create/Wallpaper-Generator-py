name: Generate Wallpapers and Deploy Pages

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  push:
    branches-ignore:
      - artifacts
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of wallpapers to generate'
        required: false
        default: '10000'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: generate-and-deploy
  cancel-in-progress: true

jobs:
  generate:
    name: Generate Wallpapers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout artifacts branch (preserve existing wallpapers)
        uses: actions/checkout@v4
        with:
          ref: artifacts
          path: dist
        continue-on-error: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate wallpapers and build site
        env:
          INPUT_COUNT: ${{ inputs.count }}
        run: |
          COUNT="${INPUT_COUNT:-10000}"
          echo "Generating $COUNT new wallpapers (preserving existing wallpapers)..."
          python3 wallpaper-generator.py --count "$COUNT" --output-dir dist/wallpapers --site-dir dist --build-site

      - name: Push to artifacts branch
        env:
          INPUT_COUNT: ${{ inputs.count }}
        run: |
          cd dist
          # If not a git repo yet (e.g. fresh repository initialization)
          if [ ! -d .git ]; then
            git init
            git checkout -b artifacts
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 1048576000
          git add -A
          COUNT="${INPUT_COUNT:-10000}"
          TOTAL="$(cat count.txt 2>/dev/null || cat count 2>/dev/null || echo "$COUNT")"
          git commit -m "Add $COUNT wallpapers [total: $TOTAL] [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]" || echo "No new changes to commit"
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifacts

  deploy:
    name: Deploy to GitHub Pages
    needs: generate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout artifacts branch
        uses: actions/checkout@v4
        with:
          ref: artifacts

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
