name: Generate Wallpapers

on:
  schedule:
    # Runs at minute 0 of every hour
    - cron: '0 * * * *'
  push:
    branches-ignore:
      - artifacts
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of wallpapers to generate'
        required: false
        default: '10000'

permissions:
  contents: write

concurrency:
  group: generate-wallpapers
  cancel-in-progress: false

jobs:
  generate:
    name: Generate Wallpapers
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate wallpapers and build site
        env:
          INPUT_COUNT: ${{ inputs.count }}
        run: |
          COUNT="${INPUT_COUNT:-10000}"
          echo "Starting generation of $COUNT wallpapers..."
          python3 wallpaper-generator.py --count "$COUNT" --output-dir dist/wallpapers --site-dir dist --build-site

      - name: Push to artifacts branch
        env:
          INPUT_COUNT: ${{ inputs.count }}
        run: |
          cd dist
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config http.postBuffer 1048576000
          git checkout -b artifacts
          git add -A
          COUNT="${INPUT_COUNT:-10000}"
          git commit -m "Generate $COUNT wallpapers [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" artifacts
